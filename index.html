</html><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px 25px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        h1 {
            margin-bottom: 10px;
            color: #222;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 21px;
            font-weight: bold;
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .small {
            margin-top: 15px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Download My App</h1>

    <p>
        Download the Android app directly to your phone.
    </p>

    <a
        href="./app-release.apk"
        download="app-release.apk"
        class="download-btn"
    >
        📥 DOWNLOAD APP NOW
    </a>

    <div class="small">
        Android APK • Direct Download
    </div>

</div>

</body>
</html>
